# Starship Prompt — Rainbow Powerline (Local)
# Same as starship.toml — the scripts handle local vs SSH internally

format = "╭$custom$fill$status$line_break$character"

# ── Segment 1: Username · OS logo · Hostname ─────────────────────────────
[custom.seg1_userhost]
command = '~/.local/bin/prompt-seg1-userhost'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 2: Directory path ────────────────────────────────────────────
[custom.seg2_path]
command = '~/.local/bin/prompt-seg2-path'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 3: GitHub user ───────────────────────────────────────────────
[custom.seg3_github]
command = '~/.local/bin/prompt-seg3-github'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 4: Git branch + release ──────────────────────────────────────
[custom.seg4_git]
command = '~/.local/bin/prompt-seg4-git'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 5: Git status ────────────────────────────────────────────────
[custom.seg5_gitstatus]
command = '~/.local/bin/prompt-seg5-gitstatus'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 6: Environments ──────────────────────────────────────────────
[custom.seg6_env]
command = '~/.local/bin/prompt-seg6-env'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Prompt character ─────────────────────────────────────────────────────
[character]
success_symbol = "╰─[❯](bold green)"
error_symbol = "╰─[❯](bold red)"

# ── Fill between prompt and right-aligned content ─────────────────────────
[fill]
symbol = " "

# ── Exit status (right-aligned on top line) ───────────────────────────────
[status]
format = "[ ✕$status ]($style)"
style = "bold red"
disabled = false
