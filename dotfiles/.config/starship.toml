# Starship Prompt — Rainbow Powerline (6 segments)
#
# Seg 1  red     #aa0000   Username · OS logo · Hostname
# Seg 2  peach   #d47040   Directory path  (prefix "in" on SSH)
# Seg 3  gold    #f5c24a   GitHub logo + user
# Seg 4  green   #66cc55   Git branch + release tag
# Seg 5  blue    #55aadd   Git status
# Seg 6  purple  #8872c8   Clock

format = "╭$custom$fill$status$line_break$character"

# ── Segment 1: Username · OS logo · Hostname ─────────────────────────────
[custom.seg1_userhost]
command = '~/.local/bin/prompt-seg1-userhost'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 2: Directory path ────────────────────────────────────────────
[custom.seg2_path]
command = '~/.local/bin/prompt-seg2-path'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 3: GitHub user ───────────────────────────────────────────────
[custom.seg3_github]
command = '~/.local/bin/prompt-seg3-github'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 4: Git branch + release ──────────────────────────────────────
[custom.seg4_git]
command = '~/.local/bin/prompt-seg4-git'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 5: Git status ────────────────────────────────────────────────
[custom.seg5_gitstatus]
command = '~/.local/bin/prompt-seg5-gitstatus'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 6: Environments ──────────────────────────────────────────────
[custom.seg6_env]
command = '~/.local/bin/prompt-seg6-env'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Prompt character ─────────────────────────────────────────────────────
[character]
success_symbol = "╰─[❯](bold green)"
error_symbol = "╰─[❯](bold red)"

# ── Fill between prompt and right-aligned content ─────────────────────────
[fill]
symbol = " "

# ── Exit status (right-aligned on top line) ───────────────────────────────
[status]
format = "[ ✕$status ]($style)"
style = "bold red"
disabled = false
