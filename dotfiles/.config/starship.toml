# Starship Prompt — Rainbow Powerline (6 segments)
#
# Seg 1  pink    #e88489   Username · OS logo · Hostname
# Seg 2  peach   #ef9f7a   Directory path  (prefix "in" on SSH)
# Seg 3  gold    #e3c991   GitHub logo + user
# Seg 4  green   #a9d48e   Git branch + release tag
# Seg 5  blue    #89bfdc   Git status
# Seg 6  purple  #bdbaf1   Clock

format = "$custom$fill$status$line_break$character"

# ── Segment 1: Username · OS logo · Hostname ─────────────────────────────
[custom.seg1_userhost]
command = '~/.local/bin/prompt-seg1-userhost'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 2: Directory path ────────────────────────────────────────────
[custom.seg2_path]
command = '~/.local/bin/prompt-seg2-path'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 3: GitHub user ───────────────────────────────────────────────
[custom.seg3_github]
command = '~/.local/bin/prompt-seg3-github'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 4: Git branch + release ──────────────────────────────────────
[custom.seg4_git]
command = '~/.local/bin/prompt-seg4-git'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 5: Git status ────────────────────────────────────────────────
[custom.seg5_gitstatus]
command = '~/.local/bin/prompt-seg5-gitstatus'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Segment 6: Environments ──────────────────────────────────────────────
[custom.seg6_env]
command = '~/.local/bin/prompt-seg6-env'
when = 'true'
shell = 'bash'
format = '$output'
ignore_timeout = true

# ── Prompt character ─────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# ── Clock (right-aligned, now in segment 6) ──────────────────────────────
[time]
disabled = true
format = "[ $time ](fg:#888888)"
time_format = "%H:%M"

# ── Fill between prompt and clock ─────────────────────────────────────────
[fill]
symbol = " "

# ── Exit status (right side, near clock) ─────────────────────────────────
[status]
format = "[ ✕$status ]($style)"
style = "bold red"
disabled = false
