# Starship Prompt — Pastel Powerline (SSH-Modus)
# User+Host sichtbar, echte Powerline-Chevrons

format = "[](fg:#5C2D6B)$username[ @ ](bg:#5C2D6B bold white)$hostname[](bg:#6B4226 fg:#5C2D6B)[ in](bg:#6B4226 bold white)$directory$custom[](fg:#6B4226)$line_break$character"

[username]
format = "[$user]($style)"
style = "bg:#5C2D6B bold yellow"

[hostname]
format = "[$hostname ]($style)"
style = "bg:#5C2D6B bold green"

[directory]
truncation_length = 0
truncate_to_repo = false
format = "[ $path ]($style)"
style = "bg:#6B4226 bold cyan"

[custom.git_section]
command = '~/.local/bin/git-prompt-section'
when = 'true'
shell = 'bash'
format = '$output'

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[status]
format = "[ $symbol$status ]($style)"
style = "red"
disabled = false
